<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}">
  </head>
  <body>
    <div class="docs-shell">
      <aside class="docs-sidebar">
        <a class="docs-home" href="{{ '/' | relative_url }}">Zero Point Systems</a>
        <nav aria-label="Documentation pages">
          <ul class="docs-nav">
            {% for item in site.data.docs_nav %}
            <li>
              <a href="{{ item.url | relative_url }}"{% if item.key == page.doc_key %} aria-current="page"{% endif %}>
                {{ item.title }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </nav>
      </aside>

      <main class="docs-main">
        <article class="doc-content">
          {{ content | inject_anchors }}
        </article>
      </main>

      <aside class="docs-toc-pane" aria-label="On this page">
        <div class="docs-toc-card">
          <p class="docs-toc-heading">On this page</p>
          <nav>
            {{ content | toc_only }}
          </nav>
        </div>
      </aside>
    </div>
  </body>
</html>
