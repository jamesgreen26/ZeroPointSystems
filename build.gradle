plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.137'
}

configurations {
    // Client-only mods: gets the Mojang-mapped attribute so ModDevGradle's
    // remapping transform is applied, matching what modRuntimeOnly receives.
    clientOnlyMods {
        attributes {
            attribute(
                Attribute.of("net.neoforged.moddevgradle.legacy.minecraft_mappings.v2", Named),
                objects.named(Named, "named")
            )
        }
    }
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

legacyForge {
    version = forge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', 'zps'
        }
    }

    mods {
        zps {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, "zps.mixins.refmap.json"
    config 'zps.mixins.json'
}

jar {
    // Merge FreeTTS and jsapi contents directly into the jar root so that
    // ServiceLoader-based voice registration works (replicates shadow mergeServiceFiles).
    from(zipTree('libs/jsapi.jar')) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    from(zipTree('libs/freetts.jar')) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest.attributes([
        "MixinConfigs": "zps.mixins.json"
    ])
}

repositories {
    mavenLocal()
    mavenCentral()

    maven { url = "https://maven.createmod.net" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Valkyrien Skies Internal"
        url = 'https://maven.valkyrienskies.org'
        content {
            includeGroupByRegex "org.valkyrien.*"
        }
    }
}

dependencies {
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    jarJar(implementation("io.github.llamalad7:mixinextras-forge:0.5.0")) {
        version {
            strictly "[0.5.0,)"
            prefer "0.5.0"
        }
    }

    // Fusion is a client-only visual mod — not needed on server or gameTestServer
    clientOnlyMods("maven.modrinth:fusion-connected-textures:1.2.12-forge-mc1.20.1")

    jarJar(modImplementation("ace.actually.radios:radios:1.2.0")) {
        version {
            strictly "[1.2.0,)"
            prefer "1.2.0"
        }
    }

    // TTS — local jars; contents are merged directly into the mod jar via the jar task below
    implementation(files('libs/jsapi.jar', 'libs/freetts.jar'))

    modImplementation("com.simibubi.create:create-$minecraft_version:$create_version:slim") { transitive = false }

    jarJar(modImplementation("com.tterrag.registrate:Registrate:$registrate_version")) {
        version {
            strictly "[$registrate_version,)"
            prefer "$registrate_version"
        }
    }

    modRuntimeOnly("mezz.jei:jei-1.20.1-forge:15.20.0.129")
    modRuntimeOnly("maven.modrinth:spark:1.10.53-forge")

    compileOnly("org.valkyrienskies.core:api:1.1.0+b714ef303e") { transitive = false }
    compileOnly("org.joml:joml-primitives:1.10.0")
    modCompileOnly("maven.modrinth:valkyrien-skies:1.20.1-forge-2.4.10")

    modCompileOnly("maven.modrinth:vs-genesis:1.20.1-0.7.2")

    //noinspection DifferentStdlibGradleVersion
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10")
    implementation("org.jetbrains.kotlin:kotlin-reflect:1.9.10")

    jarJar(modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")) {
        version {
            strictly "[${ponder_version},)"
            prefer "${ponder_version}"
        }
    }
    jarJar(modImplementation("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")) {
        version {
            strictly "[${flywheel_version},)"
            prefer "${flywheel_version}"
        }
    }

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")
}

afterEvaluate {
    tasks.named('runClient') {
        classpath += configurations.clientOnlyMods.incoming.files
    }
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources_extra'
        }
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}
