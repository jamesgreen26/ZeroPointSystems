plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
}

configurations {
    clientOnlyMods
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'zps'
        }
    }

    mods {
        zps {
            sourceSet sourceSets.main
        }
    }
}

jar {
    // Merge FreeTTS and jsapi contents directly into the jar root so that
    // ServiceLoader-based voice registration works (replicates shadow mergeServiceFiles).
    from(zipTree('libs/jsapi.jar')) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    from(zipTree('libs/freetts.jar')) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest.attributes([
        "MixinConfigs": "zps.mixins.json"
    ])
}

repositories {
    mavenLocal()
    mavenCentral()

    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ftb.dev/releases" }
    maven { url = "https://maven.architectury.dev" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Valkyrien Skies Internal"
        url = 'https://maven.valkyrienskies.org'
        content {
            includeGroupByRegex "org.valkyrien.*"
        }
    }
    maven { url = "https://maven.bawnorton.com/releases" }
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

dependencies {
    compileOnly("io.github.llamalad7:mixinextras-common:0.5.0")
    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:0.5.0")) {
        version {
            strictly "[0.5.0,)"
            prefer "0.5.0"
        }
    }

    compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1")
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7-beta.1")) {
        version {
            strictly "[0.3.7-beta.1,)"
            prefer "0.3.7-beta.1"
        }
    }

    jarJar(implementation("ace.actually.radios:radios:1.3.0")) {
        version {
            strictly "[1.2.0,)"
            prefer "1.3.0"
        }
    }

    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:[${project.sable_companion_version},)")) {
        version {
            prefer project.sable_companion_version
        }
    }

    implementation(files('libs/jsapi.jar', 'libs/freetts.jar'))
    additionalRuntimeClasspath(files('libs/jsapi.jar', 'libs/freetts.jar'))
    implementation(files('libs/Registrate-MC1.21-1.3.0+62.jar'))

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-$minecraft_version:$vanillin_version")

    implementation(jarJar("net.createmod.ponder:ponder-neoforge:$ponder_version+mc$minecraft_version") {
        version {
            strictly "[$ponder_version+mc$minecraft_version,)"
            prefer "$ponder_version+mc$minecraft_version"
        }
    })

    implementation(jarJar("dev.engine-room.flywheel:flywheel-neoforge-$minecraft_version:$flywheel_version") {
        version {
            strictly "[${flywheel_version},2.0)"
            prefer flywheel_version
        }
    })

    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    runtimeOnly("maven.modrinth:spark:${spark_version}")

    //noinspection DifferentStdlibGradleVersion
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10")
    implementation("org.jetbrains.kotlin:kotlin-reflect:1.9.10")

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")



    // compat

    compileOnly("org.valkyrienskies.core:api:1.1.0+b714ef303e") { transitive = false }
    compileOnly("org.joml:joml-primitives:1.10.0")
    compileOnlyApi("maven.modrinth:valkyrien-skies:1.20.1-forge-2.4.10")
}

test {
    useJUnitPlatform()
}

afterEvaluate {
    tasks.named('runClient') {
        classpath += configurations.clientOnlyMods.incoming.files
    }
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute(module("dev.engine_room.flywheel:flywheel-neoforge-1.21.1"))
                .using(module("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.0-10"))
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources_extra'
        }
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }

    from('docs') {
        include '**/*.md'
        into 'assets/zps/doc/en_us'
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
